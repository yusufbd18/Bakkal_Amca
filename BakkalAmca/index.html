<html>
   
    <head>
        <title>Bakkal Amca</title>

        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <div class="ana-kutu">
       
        <aside>
            <h1>Bakkal Amca</h1>
           
            <img src="resimler/cambados.jpg" alt="Bakkal Amca" width="180"> <br>
           
            <label for="marka-filtrele">Marka Seç:</label>
            <select id="marka-filtrele">
                <option>Tüm Markalar</option>
                <option value="eti">Eti</option>
                <option value="ulker">Ülker</option>
                <option value="sutas">Sütaş</option>
            </select> <br>

            <label for="urun-arama">Ürün ara:</label>
            <input type="text" id="urun-arama" placeholder="Ürün adı veya barkod girin">
            
        </aside>


        <main>
            <div class="vitrin">
                <div class="urun-karti">
                    <img src="resimler/ulkercikolataligofret.jpg" alt="Çikolatalı Gofret">
                    <h3>Çikolatalı Gofret</h3>
                    <p class="marka">Ülker</p>
                    <p class="fiyat">20.00 TL</p>
                    <small class="barkod">Barkod: 1234567</small>
                </div>
            </div>
        </main>
        
        </div>
    </body>
</html>
